[theme]
base = "light"
primaryColor = "#641C36"
backgroundColor = "#F4EBD9"
secondaryBackgroundColor = "#EADFC8"
textColor = "#27231F"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
# Loopback only: never listen on LAN/IPv6 interfaces, even if a launch command omits --server.address.
address = "127.0.0.1"
headless = true
maxUploadSize = 200
# Serves ./static (section animations) at /app/static/ for native looping <video> playback.
enableStaticServing = true

[browser]
gatherUsageStats = false
